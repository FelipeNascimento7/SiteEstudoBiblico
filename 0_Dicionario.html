<!doctype html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0_Dicionario.md | Exported</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .theme-toggle {
        position: absolute;
        z-index: 9999;
        border: none;
        background: var(--bgColor-muted);
        color: var(--fgColor-muted);
        border-radius: 8px;
        border: 1px solid var(--borderColor-default);
        padding: 6px 5px;
        cursor: pointer;
        font-size: 13px;
      }

      /* Computador */
      @media (min-width: 768px) {
        .theme-toggle {
          top: 45px;
          right: 230px;
        }
      }

      /* Celular */
      @media (max-width: 767px) {
        .theme-toggle {
          top: 15px;
          right: 15px;
          font-size: 12px;
          padding: 5px 8px;
        }
      }
    </style>
  </head>
  <body class="markdown-body" data-theme="light">
    <button id="theme-toggle" type="button" class="theme-toggle">Alternar tema</button>
    <h4 data-heading="Dicionário" dir="auto" id="Dicionário">Dicionário</h4>
<p dir="auto"><a data-tooltip-position="top" aria-label="1000_Deus" data-href="1000_Deus" href="1000_Deus" class="internal-link" rel="noopener nofollow">1000 Deus</a><br>
<a data-tooltip-position="top" aria-label="2000_Jesus_Cristo" data-href="2000_Jesus_Cristo" href="2000_Jesus_Cristo" class="internal-link" rel="noopener nofollow">2000 Jesus Cristo</a><br>
<a data-tooltip-position="top" aria-label="3000_Espirito_Santo" data-href="3000_Espirito_Santo" href="3000_Espirito_Santo" class="internal-link" rel="noopener nofollow">3000 Espírito Santo</a><br>
<a data-tooltip-position="top" aria-label="4000_Criacao" data-href="4000_Criacao" href="4000_Criacao" class="internal-link" rel="noopener nofollow">4000 Criação</a><br>
<a data-tooltip-position="top" aria-label="5000_Humanidade" data-href="5000_Humanidade" href="5000_Humanidade" class="internal-link" rel="noopener nofollow">5000 Humanidade</a><br>
<a data-tooltip-position="top" aria-label="6000_Pecado_e_Salvacao" data-href="6000_Pecado_e_Salvacao" href="6000_Pecado_e_Salvacao" class="internal-link" rel="noopener nofollow">6000 Pecado e Salvação</a><br>
<a data-tooltip-position="top" aria-label="7000_A_Vida_do_Crente" data-href="7000_A_Vida_do_Crente" href="7000_A_Vida_do_Crente" class="internal-link" rel="noopener nofollow">7000 A Vida do Crente</a><br>
<a data-tooltip-position="top" aria-label="9000_Últimas_Coisas" data-href="9000_Últimas_Coisas" href="9000_Últimas_Coisas" class="internal-link" rel="noopener nofollow">9000 Últimas Coisas</a></p>
    <script>
      (function () {
        var STORAGE_KEY = "export-theme";
        var LEGACY_KEY = "theme";
        var body = document.body;
        var button = document.getElementById("theme-toggle");
        if (!body || !button) return;

        function loadSavedTheme() {
          try {
            var saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_KEY);
            if (saved === "dark" || saved === "light") return saved;
          } catch (e) {}
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        function saveTheme(theme) {
          try {
            localStorage.setItem(STORAGE_KEY, theme);
            localStorage.setItem(LEGACY_KEY, theme);
          } catch (e) {}
        }

        function applyTheme(theme) {
          body.setAttribute("data-theme", theme);
          saveTheme(theme);
        }

        var currentTheme = loadSavedTheme();
        applyTheme(currentTheme);

        button.addEventListener("click", function () {
          currentTheme = currentTheme === "dark" ? "light" : "dark";
          applyTheme(currentTheme);
        });
      })();
    </script>
  </body>
</html>
